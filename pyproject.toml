[project]
name = "solution-tradeoff-skills"
version = "0.1.0"
description = "Agent Skill for multi-stakeholder solution trade-off analysis, run through conversation."
authors = [{ name = "Jan van den Brand" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "pyyaml (>=6.0,<7)",
    "jsonschema (>=4.21,<5)",
    "openpyxl (>=3.1,<4)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
flake8 = "^7.0"
black = "^24.0"
bandit = "^1.7"
mypy = "^1.9"
types-PyYAML = "^6.0"
types-jsonschema = "^4.21"
types-openpyxl = "^3.1"

[tool.pytest.ini_options]
pythonpath = ["skills/solution-tradeoff/scripts"]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
