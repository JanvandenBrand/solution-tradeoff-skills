# Default settings for the solution-tradeoff scripts.
# Every script accepts --config <path> to use a copy with other values.

spreadsheet:
  requirements_sheet: "Requirements"
  principles_sheet: "Principles"

  # Logical name -> column header in the requirements sheet.
  columns:
    req_id: "Ref"
    description: "Requirement"
    domain: "Category"
    moscow: "MoSCoW"
    plateau: "Plateau"
    status: "Status"
    apr_ref: "APR Link"
    ad_ref: "AD Ref"

  # Columns that may be absent; they load as null with a warning.
  optional_columns: ["plateau", "apr_ref", "ad_ref"]

  # Logical name -> column header in the principles sheet.
  principles_columns:
    principle_id: "Ref"
    description: "Architecture Principle"
    domain: "Category"

filter:
  # Requirements with these statuses never enter the analysis (case-insensitive).
  # Use the status values of your own spreadsheet.
  excluded_statuses: ["removed"]
  # Draft requirements are kept only when their decision-reference column (ad_ref)
  # names the current decision. Excluded drafts are counted and reported.
  draft_statuses: ["draft"]
  # MoSCoW levels kept when the decision does not say otherwise.
  default_moscow: ["must", "should"]

scope:
  # Above this many in-scope requirements, moscow_filter.py warns and the
  # skill proposes a narrower scope.
  max_requirements: 60

budget:
  # Points per perspective = requirement count x multiplier, rounded to round_to,
  # never below minimum.
  multiplier: 2.5
  round_to: 5
  minimum: 15

rating:
  # Ratings are whole numbers on this scale (inclusive).
  minimum: 0
  maximum: 10

elimination:
  # A candidate that scores below this on any Must requirement is eliminated.
  must_score_threshold: 6
